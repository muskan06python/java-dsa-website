<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campus Trail &middot; Wayfinding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700;800&family=Work+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand">
      <span class="brand-mark">&#9670;</span>
      <span class="brand-name">Campus&nbsp;Trail</span>
    </div>
    <div class="eyebrow">Shortest-route wayfinding &middot; Dijkstra's algorithm</div>
  </div>
</header>

<main>
  <aside class="sidebar">
    <div class="log-card">
      <h2 class="log-title">Plan a route</h2>

      <div class="field-group">
        <label for="start-select">Trailhead <span class="field-hint">(start)</span></label>
        <select id="start-select"></select>
      </div>

      <button class="swap-btn" id="swap-btn" title="Swap trailhead and destination">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
          <path d="M7 10l-4 4 4 4M3 14h14M17 4l4 4-4 4M21 8H7"/>
        </svg>
        Swap
      </button>

      <div class="field-group">
        <label for="end-select">Destination</label>
        <select id="end-select"></select>
      </div>

      <button class="find-btn" id="find-btn">Chart the trail</button>
    </div>

    <div class="legend-card">
      <h2 class="log-title">Trail markers</h2>
      <ol class="legend-list" id="location-list"></ol>
    </div>
  </aside>

  <section class="map-area">
    <div class="map-frame">
      <svg id="map-svg" viewBox="0 0 900 580" preserveAspectRatio="xMidYMid meet"></svg>
    </div>

    <div class="permit" id="permit">
      <div class="permit-row">
        <div class="permit-label">Trail</div>
        <div class="permit-route" id="route-path-text"></div>
      </div>
      <div class="permit-stats">
        <div class="permit-stat">
          <div class="permit-value" id="stat-distance">0</div>
          <div class="permit-unit">Meters</div>
        </div>
        <div class="permit-stat">
          <div class="permit-value" id="stat-time">0</div>
          <div class="permit-unit">Min on foot</div>
        </div>
      </div>
    </div>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
